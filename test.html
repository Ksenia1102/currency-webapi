<!DOCTYPE html>
<html>
<head>
    <title>Currency Test</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        button { margin: 5px; padding: 10px; }
        .section { border: 1px solid #ccc; padding: 15px; margin: 10px 0; }
        .logs { background: #000; color: #0f0; padding: 10px; height: 200px; overflow-y: scroll; }
        .currency { border: 1px solid #ddd; padding: 10px; margin: 5px; }
    </style>
</head>
<body>
    <h1>Currency Test</h1>
    
    <div class="section">
        <h3>Управление</h3>
        <button onclick="connectWS()">Connect WebSocket</button>
        <button onclick="getAll()">Get All Currencies</button>
        <button onclick="runTask()">Run Background Task</button>
    </div>
    
    <div class="section">
        <h3>Валюты</h3>
        <div id="currencies"></div>
    </div>
    
    <div class="section">
        <h3>Логи</h3>
        <div id="logs" class="logs"></div>
    </div>
    
    <script>
        let ws = null;
        
        function log(msg) {
            const logs = document.getElementById('logs');
            logs.innerHTML += new Date().toLocaleTimeString() + ': ' + msg + '<br>';
            logs.scrollTop = logs.scrollHeight;
        }
        
        // WebSocket
        function connectWS() {
            ws = new WebSocket('ws://localhost:8000/ws/currencies');
            
            ws.onopen = () => {
                log('✅ WebSocket connected');
            };
            
            ws.onmessage = (e) => {
                const data = JSON.parse(e.data);
                log('📨 ' + data.type + ': ' + JSON.stringify(data.data));
                
                if (data.type === 'currencies_updated') {
                    getAll(); // Обновляем список валют
                }
            };
            
            ws.onclose = () => {
                log('❌ WebSocket disconnected');
            };
        }
        
        // API calls
        async function apiCall(method, endpoint, data = null) {
            try {
                const options = {
                    method,
                    headers: {'Content-Type': 'application/json'}
                };
                if (data) options.body = JSON.stringify(data);
                
                const response = await fetch('http://localhost:8000/api' + endpoint, options);
                const result = await response.json();
                log(`${method} ${endpoint}: ${JSON.stringify(result)}`);
                return result;
            } catch (error) {
                log(`Error: ${error}`);
            }
        }
        
        async function getAll() {
            const data = await apiCall('GET', '/currencies');
            const container = document.getElementById('currencies');
            container.innerHTML = '';
            
            data.forEach(currency => {
                const div = document.createElement('div');
                div.className = 'currency';
                div.innerHTML = `
                    <strong>${currency.currency_code}</strong> - ${currency.currency_name}
                    <br>Курс: ${currency.rate} (за ${currency.nominal} ед.)
                    <br>Тип: ${isCrypto(currency.currency_code) ? 'КРИПТА' : 'ВАЛЮТА'}
                `;
                container.appendChild(div);
            });
        }
        
        function isCrypto(code) {
            const crypto = ['BTC', 'ETH', 'BNB', 'SOL', 'XRP'];
            return crypto.includes(code);
        }
        
        async function runTask() {
            await apiCall('POST', '/tasks/run');
            log('Фоновая задача запущена');
        }
        
        // Auto connect
        connectWS();
        getAll();
    </script>
</body>
</html>
